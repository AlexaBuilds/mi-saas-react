version: '3.8'
services:
  react_dev:
    image: node:24-alpine
    container_name: react_dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app/mi-saas-react
      - /app/mi-saas-react/node_modules
    working_dir: /app/mi-saas-react
    command: sh -c "npm ci --prefer-offline --no-audit --progress=false && npm run dev -- --host --port 5173"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5173/mi-saas-react/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    tty: true
